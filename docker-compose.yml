# Production stack for a single VPS:  db (PostgreSQL)  <-  backend (gunicorn)  <-  web (Caddy + React)
#
#   cp .env.production.example .env      # then fill it in (see docs/DEPLOYMENT.md)
#   docker compose up -d --build
#
# Only the `web` service publishes ports; the database and API are reachable
# solely on the internal Docker network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: febe_attendance
      POSTGRES_USER: febe_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U febe_user -d febe_attendance"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Mogadishu}
      TZ: ${APP_TIMEZONE:-Africa/Mogadishu}   # so shell tools and logs use campus time too
      DATABASE_URL: postgresql+psycopg://febe_user:${POSTGRES_PASSWORD}@db:5432/febe_attendance
      TRUSTED_PROXY_COUNT: "1"
      FRONTEND_ORIGIN: https://${DOMAIN:?set DOMAIN in .env}
      FRONTEND_BASE_URL: https://${DOMAIN}
      CHECKIN_URL: https://${DOMAIN}/checkin
      STUDENT_CHECKIN_URL: https://${DOMAIN}/student-checkin
      SECRET_KEY: ${SECRET_KEY:?}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?}
      KIOSK_TOTP_SECRET: ${KIOSK_TOTP_SECRET:?}
      KIOSK_ACCESS_KEY: ${KIOSK_ACCESS_KEY:?}
      STUDENT_CODE_TOTP_SECRET: ${STUDENT_CODE_TOTP_SECRET:?}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Faculty Admin}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-}
    volumes:
      - uploads:/app/uploads
      - ./data:/data:ro   # spreadsheets for `flask import-*` (kept out of git, copied to the server by hand)

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
